name: Docker

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 16 * * 1"
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - entrypoint.sh
  pull_request:
    paths:
      - Dockerfile

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker build
    uses: Docker-Collection/reusable-workflows/.github/workflows/docker-build.yml@a7aeea016f236832bf5adb881fc5cd41f2db3384 # main
    with:
      docker_name: "ghcr.io/docker-collection/phira-mp"
      docker_label_author: "Efina"
      docker_label_title: "Docker for Phira Multiplayer"
      docker_label_description: "Multiplayer Phira server container"
